# L1 objects: `label`, and optional `class`, `subtitle`, `icon`, `shape` and
# `group_style` (a key in the profile's group styles).

# One object per icon a built pack titles, as `<id_prefix><key>` labelled with
# the publisher's name, its hyphens and underscores read as spaces. An entry under `objects` wins over one made here.
generated_objects:
  - {pack: aws, id_prefix: aws.}
  - {pack: starter, id_prefix: icon.}
  - {pack: k8s, id_prefix: k8s.}
  - {pack: carbon, id_prefix: carbon.}
  - {pack: hashicorp, id_prefix: hashicorp.}
  - {pack: tabler, id_prefix: tabler.}
  - {pack: redhat, id_prefix: redhat.}
  - {pack: shownet, id_prefix: shownet.}
  - {pack: asf-kafka, id_prefix: asf.}
  - {pack: asf-flink, id_prefix: asf.}
  - {pack: asf-iceberg, id_prefix: asf.}
  - {pack: asf-spark, id_prefix: asf.}

objects:
  aws.cloud: {label: AWS Cloud, icon: "aws:group-aws-cloud-logo", group_style: aws-cloud}
  aws.region: {label: Region, icon: "aws:group-region", group_style: region}
  aws.vpc: {label: VPC, icon: "aws:group-virtual-private-cloud-vpc", group_style: virtual-private-cloud-vpc}
  aws.public-subnet: {label: Public subnet, icon: "aws:group-public-subnet", group_style: public-subnet}
  aws.private-subnet: {label: Private subnet, icon: "aws:group-private-subnet", group_style: private-subnet}
  aws.az: {label: Availability Zone, group_style: availability-zone}
  aws.users: {label: Users, icon: "aws:res-users"}
  aws.user: {label: User, icon: "aws:res-user"}
  aws.eks: {label: Amazon EKS, icon: "aws:amazon-elastic-kubernetes-service"}
  aws.eks-cluster: {label: Amazon EKS cluster, icon: "aws:amazon-elastic-kubernetes-service-32", group_style: service}
  aws.msk: {label: Amazon MSK, icon: "aws:amazon-managed-streaming-for-apache-kafka"}
  aws.s3: {label: Amazon S3, icon: "aws:amazon-simple-storage-service"}
  aws.route53: {label: Amazon Route 53, icon: "aws:amazon-route-53"}
  aws.kms: {label: AWS KMS, icon: "aws:aws-key-management-service"}
  aws.secrets-manager: {label: AWS Secrets Manager, icon: "aws:aws-secrets-manager"}
  aws.ecr: {label: Amazon ECR, icon: "aws:amazon-elastic-container-registry"}
  aws.sqs: {label: Amazon SQS, icon: "aws:amazon-simple-queue-service"}
  aws.cloudwatch: {label: Amazon CloudWatch, icon: "aws:amazon-cloudwatch"}
  aws.cloudtrail: {label: AWS CloudTrail, icon: "aws:aws-cloudtrail"}
  aws.nlb: {label: Network Load Balancer, icon: "aws:res-elastic-load-balancing-network-load-balancer"}
  aws.nat-gateway: {label: NAT gateway, icon: "aws:res-amazon-vpc-nat-gateway"}
  aws.internet-gateway: {label: Internet gateway, icon: "aws:res-amazon-vpc-internet-gateway"}
  aws.ec2: {label: Amazon EC2 instances, icon: "aws:res-amazon-ec2-instances"}
  aws.ec2-instance: {label: Instance, icon: "aws:res-amazon-ec2-instance"}
  aws.vpc-endpoint: {label: VPC endpoint, icon: "aws:res-amazon-vpc-endpoints"}
  aws.client: {label: Client, icon: "aws:res-client"}
  aws.waf: {label: AWS WAF, icon: "aws:aws-waf"}
  aws.cloudfront: {label: Amazon CloudFront, icon: "aws:amazon-cloudfront"}
  aws.acm: {label: AWS Certificate Manager, icon: "aws:aws-certificate-manager"}
  aws.alb: {label: Application Load Balancer, icon: "aws:res-elastic-load-balancing-application-load-balancer"}
