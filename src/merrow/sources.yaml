# Vendor sources, part of merrow's base layer. A reference repo adds or
# overrides one under the same `sources:` key.
#
# `names` maps a file's path in the download to an icon key. First match wins.
# `key: null` skips the file. A file no rule matches shows as unmatched in the
# build report.

sources:
  aws-icons:
    format: svg
    prefix: aws
    # The page links each release by full path, with a content hash in the name.
    check:
      source: regex
      url: https://aws.amazon.com/architecture/icons/
      regex: //(d1\.awsstatic\.com/[^"']*/Icon-package_\d{8}\.[0-9a-f]+\.zip)
    url: https://{version}
    names:
      - match: /Arch-Category_([^/]+)_64\.svg$
        key: category-\1
      - match: /Arch-Category_[^/]+_(16|32|48)\.svg$
        key: null
      # A service icon AWS ships in light and dark takes the pack's `-dark` form.
      - match: /Arch_([^/]+)_Light_64\.svg$
        key: \1
        title: \1
      - match: /Arch_([^/]+)_Dark_64\.svg$
        key: \1-dark
      - match: /Arch_([^/]+)_Light_32\.svg$
        key: \1-32
      - match: /Arch_([^/]+)_Dark_32\.svg$
        key: \1-dark-32
      # Service icons ship at 16, 32, 48 and 64. The pack carries the 64 artwork,
      # and the 32 one for a custom service group (deck slide 26) as `<name>-32`.
      - match: /Arch_([^/]+)_64\.svg$
        key: \1
        title: \1
      - match: /Arch_([^/]+)_32\.svg$
        key: \1-32
      - match: /Arch_[^/]+_(16|48)\.svg$
        key: null
      - match: /Res_([^/]+)_48_Dark\.svg$
        key: res-\1-dark
      - match: /Res_([^/]+)_48(_Light)?\.svg$
        key: res-\1
        title: \1
      - match: Architecture-Group-Icons[^/]*/(.*/)?([^/]+)_32_Dark\.svg$
        key: group-\2-dark
      - match: Architecture-Group-Icons[^/]*/(.*/)?([^/]+)_32\.svg$
        key: group-\2
    # Short names architects use, written into the pack as Iconify aliases.
    aliases:
      apigw: amazon-api-gateway
      acm: aws-certificate-manager
      cfn: aws-cloudformation
      cloudfront: amazon-cloudfront
      cloudwatch: amazon-cloudwatch
      dynamodb: amazon-dynamodb
      ec2: amazon-ec2
      ecr: amazon-elastic-container-registry
      ecs: amazon-elastic-container-service
      eks: amazon-elastic-kubernetes-service
      elasticache: amazon-elasticache
      eventbridge: amazon-eventbridge
      fargate: aws-fargate
      glue: aws-glue
      iam: aws-identity-and-access-management
      kms: aws-key-management-service
      lambda: aws-lambda
      msk: amazon-managed-streaming-for-apache-kafka
      opensearch: amazon-opensearch-service
      rds: amazon-rds
      route53: amazon-route-53
      s3: amazon-simple-storage-service
      secrets-manager: aws-secrets-manager
      sns: amazon-simple-notification-service
      sqs: amazon-simple-queue-service
      ssm: aws-systems-manager
      step-functions: aws-step-functions
      transit-gateway: aws-transit-gateway
      vpc: amazon-virtual-private-cloud

  # Group boxes (Cloud, Region, VPC, subnets ...) from AWS's PPTX toolkit.
  aws-groups:
    format: pptx
    prefix: aws
    check:
      source: regex
      url: https://aws.amazon.com/architecture/icons/
      regex: //(d1\.awsstatic\.com/[^"']*/Microsoft-PPTx-toolkits_\d{8}\.[0-9a-f]+\.zip)
    url: https://{version}
    decks:
      light: For-Light-BG_\d+\.pptx$
      dark: For-Dark-BG_\d+\.pptx$
    # The section's first page, titled "Groups 1/5". Contents slides list "Groups" too.
    slide_title: ^Groups\s+1/\d+

  kubernetes-icons:
    format: svg
    prefix: k8s
    # The newest commit touching icons/. Version is its date, revision its sha.
    check:
      source: github
      github: kubernetes/community
      path: icons
    url: https://codeload.github.com/kubernetes/community/tar.gz/{revision}
    names:
      - match: /icons/svg/.+/labeled/([^/]+)\.svg$
        key: \1
      - match: /icons/svg/.+/unlabeled/([^/]+)\.svg$
        key: \1-unlabeled
      # The download is the whole kubernetes/community repo.
      - match: .
        key: null
    # File names are kubectl short names, so each title is the resource's name.
    titles:
      api: API server
      c-c-m: Cloud controller manager
      c-m: Controller manager
      c-role: ClusterRole
      cm: ConfigMap
      control-plane: Control plane
      crb: ClusterRoleBinding
      crd: CustomResourceDefinition
      cronjob: CronJob
      deploy: Deployment
      ds: DaemonSet
      ep: Endpoints
      etcd: etcd
      group: Group
      hpa: HorizontalPodAutoscaler
      ing: Ingress
      job: Job
      k-proxy: kube-proxy
      kubelet: kubelet
      limits: LimitRange
      netpol: NetworkPolicy
      node: Node
      ns: Namespace
      pod: Pod
      psp: PodSecurityPolicy
      pv: PersistentVolume
      pvc: PersistentVolumeClaim
      quota: ResourceQuota
      rb: RoleBinding
      role: Role
      rs: ReplicaSet
      sa: ServiceAccount
      sc: StorageClass
      sched: Scheduler
      secret: Secret
      sts: StatefulSet
      svc: Service
      user: User
      vol: Volume

  # Google Cloud publishes stable URLs with no version signal, so the content
  # hash is the version. No terms published: local-only, never committed.
  gcp-icons:
    format: svg
    prefix: gcp
    check:
      source: content
    url: https://services.google.com/fh/files/misc/core-products-icons.zip
    names:
      - match: ^Unique Icons/([^/]+)/SVG/[^/]+\.svg$
        key: \1

  gcp-category-icons:
    format: svg
    prefix: gcp-category
    check:
      source: content
    url: https://services.google.com/fh/files/misc/category-icons.zip
    names:
      - match: ^Category Icons/([^/]+)/SVG/[^/]+\.svg$
        key: \1

  # Oracle serves a fixed URL behind a redirect, with an ETag that changes per release.
  oci-icons:
    format: vssx
    prefix: oci
    check:
      source: httpheader
      url: https://docs.oracle.com/iaas/Content/Resources/Assets/OCI_Icons_Visio.zip
      header: ETag
      follow_redirects: true
      regex: '"(.+)"'
    url: https://docs.oracle.com/iaas/Content/Resources/Assets/OCI_Icons_Visio.zip
    names:
      # Every stencil carries copies of its colour-theme master: not an icon.
      - match: /Oracle Redwood(\.\d+)?$
        key: null
      - match: ^[^/]+/(.+)$
        key: \1

  ibm-icons:
    format: svg
    prefix: ibm
    check:
      source: github
      github: IBM-Cloud/architecture-icons
      use_latest_release: true
    url: https://github.com/IBM-Cloud/architecture-icons/archive/refs/tags/{version}.tar.gz
    names:
      - match: /svg/(?:[^/]+/)*([^/]+)\.svg$
        key: \1
      # Whole template diagrams, not icons.
      - match: /images/
        key: null

  # Openly licensed sets: the built pack may be redistributed with its licence.
  # Each is monochrome and sets no colour, so `fill` paints it in the theme's.
  carbon-icons:
    format: svg
    prefix: carbon
    fill: currentColor
    info:
      name: Carbon icons
      author: {name: IBM, url: 'https://github.com/carbon-design-system/carbon'}
      license: {title: Apache License 2.0, spdx: Apache-2.0, url: 'https://www.apache.org/licenses/LICENSE-2.0'}
    check:
      source: npm
      npm: "@carbon/icons"
    url: https://registry.npmjs.org/@carbon/icons/-/icons-{version}.tgz
    names:
      # IBM's and third parties' marks, not generic icons.
      - match: ^package/svg/32/(ibm|logo)-[^/]*\.svg$
        key: null
      - match: ^package/svg/32/([^/]+)\.svg$
        key: \1
        title: \1
      - match: .
        key: null

  hashicorp-icons:
    format: svg
    prefix: hashicorp
    info:
      name: Flight icons
      author: {name: HashiCorp, url: 'https://github.com/hashicorp/design-system'}
      license: {title: Mozilla Public License 2.0, spdx: MPL-2.0, url: 'https://www.mozilla.org/MPL/2.0/'}
    check:
      source: npm
      npm: "@hashicorp/flight-icons"
    url: https://registry.npmjs.org/@hashicorp/flight-icons/-/flight-icons-{version}.tgz
    names:
      - match: ^package/svg/([^/]+)-24\.svg$
        key: \1
        title: \1
      - match: .
        key: null

  tabler-icons:
    format: svg
    prefix: tabler
    info:
      name: Tabler icons
      author: {name: Pawel Kuna, url: 'https://github.com/tabler/tabler-icons'}
      license: {title: MIT, spdx: MIT, url: 'https://github.com/tabler/tabler-icons/blob/main/LICENSE'}
    check:
      source: npm
      npm: "@tabler/icons"
    url: https://registry.npmjs.org/@tabler/icons/-/icons-{version}.tgz
    names:
      # Brand marks, not generic icons.
      - match: ^package/icons/outline/brand-[^/]*\.svg$
        key: null
      - match: ^package/icons/outline/([^/]+)\.svg$
        key: \1
        title: \1
      - match: .
        key: null

  redhat-icons:
    format: svg
    prefix: redhat
    fill: currentColor
    info:
      name: Red Hat standard icons
      author: {name: Red Hat, url: 'https://github.com/RedHat-UX/red-hat-icons'}
      license: {title: CC BY 4.0, spdx: CC-BY-4.0, url: 'https://creativecommons.org/licenses/by/4.0/'}
    check:
      source: github
      github: RedHat-UX/red-hat-icons
      use_latest_release: true
    url: https://github.com/RedHat-UX/red-hat-icons/archive/refs/tags/{version}.tar.gz
    names:
      - match: /src/standard/([^/]+)\.svg$
        key: \1
        title: \1
      - match: .
        key: null

  # Network devices by layer, from the Interop Tokyo ShowNet NOC team.
  shownet-icons:
    format: svg
    prefix: shownet
    info:
      name: ShowNet icons
      author: {name: Interop Tokyo ShowNet NOC Team, url: 'https://github.com/interop-tokyo-shownet/shownet-icons'}
      license: {title: CC BY 4.0, spdx: CC-BY-4.0, url: 'https://creativecommons.org/licenses/by/4.0/'}
    check:
      source: github
      github: interop-tokyo-shownet/shownet-icons
    url: https://codeload.github.com/interop-tokyo-shownet/shownet-icons/tar.gz/{revision}
    names:
      - match: /svg/([^/]+)\.svg$
        key: \1
        title: \1
      - match: .
        key: null

  # merrow's bundled pack: a small generic set from Carbon, keyed by concept.
  # `make starter` rebuilds it into src/merrow/packs/ after a Carbon bump.
  starter-icons:
    format: svg
    prefix: starter
    fill: currentColor
    info:
      name: Carbon icons
      author: {name: IBM, url: 'https://github.com/carbon-design-system/carbon'}
      license: {title: Apache License 2.0, spdx: Apache-2.0, url: 'https://www.apache.org/licenses/LICENSE-2.0'}
    check:
      source: npm
      npm: "@carbon/icons"
    url: https://registry.npmjs.org/@carbon/icons/-/icons-{version}.tgz
    names:
      - {match: '^package/svg/32/bare-+metal-+server\.svg$', key: server, title: Server}
      - {match: '^package/svg/32/data-+base\.svg$', key: database, title: Database}
      - {match: '^package/svg/32/message-+queue\.svg$', key: queue, title: Queue}
      - {match: '^package/svg/32/flow-+stream\.svg$', key: stream, title: Stream}
      - {match: '^package/svg/32/flash\.svg$', key: cache, title: Cache}
      - {match: '^package/svg/32/object-+storage\.svg$', key: object-storage, title: Object storage}
      - {match: '^package/svg/32/file-+storage\.svg$', key: file-storage, title: File storage}
      - {match: '^package/svg/32/load-+balancer-+network\.svg$', key: load-balancer, title: Load balancer}
      - {match: '^package/svg/32/firewall\.svg$', key: firewall, title: Firewall}
      - {match: '^package/svg/32/router\.svg$', key: router, title: Router}
      - {match: '^package/svg/32/switch-+layer-+2\.svg$', key: switch, title: Switch}
      - {match: '^package/svg/32/user\.svg$', key: user, title: User}
      - {match: '^package/svg/32/user-+multiple\.svg$', key: users, title: Users}
      - {match: '^package/svg/32/application-+web\.svg$', key: browser, title: Browser}
      - {match: '^package/svg/32/mobile\.svg$', key: mobile, title: Mobile}
      - {match: '^package/svg/32/api\.svg$', key: api, title: API}
      - {match: '^package/svg/32/function\.svg$', key: function, title: Function}
      - {match: '^package/svg/32/container-+software\.svg$', key: container, title: Container}
      - {match: '^package/svg/32/assembly-+cluster\.svg$', key: cluster, title: Cluster}
      - {match: '^package/svg/32/cloud\.svg$', key: cloud, title: Cloud}
      - {match: '^package/svg/32/data-+center\.svg$', key: datacentre, title: Datacentre}
      - {match: '^package/svg/32/chat\.svg$', key: message, title: Message}
      - {match: '^package/svg/32/email\.svg$', key: email, title: Email}
      - {match: '^package/svg/32/password\.svg$', key: secret, title: Secret}
      - {match: '^package/svg/32/locked\.svg$', key: lock, title: Lock}
      - {match: '^package/svg/32/dashboard\.svg$', key: metrics, title: Metrics}
      - {match: '^package/svg/32/cloud-+logging\.svg$', key: log, title: Log}
      - {match: '^package/svg/32/search\.svg$', key: search, title: Search}
      - {match: '^package/svg/32/content-+delivery-+network\.svg$', key: cdn, title: CDN}
      - {match: '^package/svg/32/dns-+services\.svg$', key: dns, title: DNS}
      - {match: '^package/svg/32/gateway-+api\.svg$', key: gateway, title: Gateway}
      - {match: '^package/svg/32/event-+schedule\.svg$', key: scheduler, title: Scheduler}
      - {match: '^package/svg/32/notebook\.svg$', key: notebook, title: Notebook}
      - {match: '^package/svg/32/machine-+learning-+model\.svg$', key: ai-model, title: AI model}
      - match: .
        key: null
