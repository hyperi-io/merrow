#
# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

language: python
classification: general-oss
license: Apache-2.0
project:
  status: experimental
quality:
  enabled: true
test:
  enabled: true
  python:
    # Every fixture lives in tmp_path or on a port the OS picks.
    parallel: auto
build:
  enabled: true
  strategies:
  - native
release:
  enabled: true
  channel: alpha
  # Private until Derek flips it public: install from git, never PyPI.
  destinations:
    python: false
