title: L2 Services -- OpenShift platform
description: The control plane machines run Operators that manage the cluster, hold its state in etcd and schedule pods onto the compute machines. The Cluster Version Operator upgrades the cluster Operators, and Operator Lifecycle Manager installs optional add-on Operators. Redrawn from the OpenShift Container Platform control plane architecture documentation.
objects:
  ocp.cvo: {label: Cluster Version Operator, subtitle: upgrades the cluster, icon: "redhat:operator"}
  ocp.cluster-operators: {label: Cluster Operators, subtitle: one per area of cluster function, icon: "redhat:cluster"}
  ocp.olm: {label: Operator Lifecycle Manager, subtitle: software catalog, icon: "redhat:operator"}
  ocp.add-ons: {label: Add-on Operators, subtitle: "optional, for applications", icon: "redhat:containerized-app"}
  ocp.etcd: {class: store, label: etcd, subtitle: cluster state, icon: "starter:database"}
  ocp.scheduler: {label: Scheduler, subtitle: places pods on nodes, icon: "starter:scheduler"}
  ocp.kubelet: {label: kubelet, subtitle: starts and stops containers, icon: "redhat:server"}
  ocp.crio: {label: CRI-O, subtitle: container engine, icon: "redhat:container"}
  ocp.proxy: {label: Service proxy, subtitle: pod networking across workers, icon: "starter:router"}
groups:
  - {id: controlplane, label: Control plane machines}
  - {id: compute, label: Compute machines}
nodes:
  - {id: cvo, object: ocp.cvo, group: controlplane}
  - {id: clusterops, object: ocp.cluster-operators, group: controlplane}
  - {id: etcd, object: ocp.etcd, group: controlplane}
  - {id: olm, object: ocp.olm, group: controlplane}
  - {id: addons, object: ocp.add-ons, group: controlplane}
  - {id: scheduler, object: ocp.scheduler, group: controlplane}
  - {id: kubelet, object: ocp.kubelet, group: compute}
  - {id: crio, object: ocp.crio, group: compute}
  - {id: proxy, object: ocp.proxy, group: compute}
edges:
  - {source: cvo, target: clusterops}
  - {source: clusterops, target: etcd}
  - {source: olm, target: addons}
  - {source: controlplane, target: compute}
