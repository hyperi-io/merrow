# Installs merrow as a CLI the way a user does, on each OS, and runs it.
name: Install

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ vars.GH_RUNNER_PYTHON || vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
            required: true
          - os: macos-latest
            required: true
          - os: windows-latest
            required: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install the CLI
        run: uv tool install --python 3.14 .
      - name: Browser system libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # Install as the runner first, so root only adds the system libraries.
        run: |
          merrow tools ensure
          sudo env "PATH=$PATH" "HOME=$HOME" merrow tools ensure --install-deps
      - name: Run it
        shell: bash
        run: |
          merrow --version
          merrow config get
          merrow tools ensure
          merrow diagram render tests/fixtures/smoke.mmd --out out
          test -s out/smoke-light.svg
          test -s out/smoke-dark.svg
