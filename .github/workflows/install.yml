# Installs merrow as a CLI the way a user does, on each OS, and runs it.
name: Install

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ vars.GH_RUNNER_PYTHON || vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
            required: true
          - os: macos-latest
            required: true
          - os: windows-latest
            required: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux and macOS: the installer, from no uv, as a new user runs it.
      - name: Install (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./install.sh
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
      # Windows, best effort: the README's manual steps.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: runner.os == 'Windows'
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: uv tool install --python "$(cat .python-version)" .
      - name: Run it
        shell: bash
        run: |
          merrow --version
          merrow config get
          merrow tools ensure
          merrow diagram render tests/fixtures/smoke.mmd --out out
          test -s out/smoke-light.svg
          test -s out/smoke-dark.svg
